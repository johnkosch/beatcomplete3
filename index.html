<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete the Measure — Irregular Meter</title>

  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 10px;
    }

    #instructions {
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    #score {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 18px auto;
      height: 190px;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      width: 100%;
    }

    #score svg {
      width: 50%;
      max-width: 500px;
      height: 150px;
      max-height: 150px;
      display: block;
    }

    .answer-buttons {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: nowrap;
      margin: 14px auto;
      max-width: 100%;
    }

    .answer-button {
      width: 120px;
      min-width: 120px;
      height: 108px;
      min-height: 108px;
      border: 2px solid #333;
      border-radius: 10px;
      cursor: pointer;
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 9px;
      overflow: hidden;
    }

    .answer-button:hover {
      background: #eeeeee;
    }

    .answer-button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .answer-button svg {
      width: 102px;
      height: 88px;
      display: block;
      overflow: hidden;
      transform: scale(1.35);
      transform-origin: center center;
    }

    #feedback {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
      margin: 15px;
    }
  
    #voiceoverControls {
      margin-bottom: 14px;
    }

    .voiceover-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .voiceover-controls label {
      font-weight: 600;
    }

    .voiceover-controls button {
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    #voiceoverStatus {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

  </style>
</head>

<body>

  <h1>Complete the Measure</h1>

  <div class="voiceover-controls" id="voiceoverControls">
    <label for="voiceoverToggle">
      <input type="checkbox" id="voiceoverToggle" checked>
      Voiceover
    </label>
    <button type="button" id="repeatPromptButton">Repeat prompt</button>
  </div>

  <div id="voiceoverStatus" aria-live="polite"></div>


  <div id="instructions">
    Complete each measure with a single note of the proper duration.
  </div>

  <div id="score" aria-label="Rhythm with a missing note"></div>

  <div class="answer-buttons">

    <button id="eighthButton" class="answer-button" aria-label="Eighth note"></button>

    <button id="quarterButton" class="answer-button" aria-label="Quarter note"></button>

    <button id="dottedQuarterButton" class="answer-button" aria-label="Dotted quarter note"></button>

    <button id="halfButton" class="answer-button" aria-label="Half note"></button>

  </div>

  <div id="feedback" aria-live="polite"></div>
<script>

let vrvToolkit;
let currentExercise = null;
let answered = false;
let previousSignature = null;

/* =======================================================
   RHYTHM UNITS
   Source: Irregular Meter.txt
   Values are stored in eighth-note pulses before doubling
   for 5/4 and 7/4.
======================================================= */

function note(pname, oct, dur, dots=0) {
  return dots
    ? `<note pname="${pname}" oct="${oct}" dur="${dur}" dots="${dots}"/>`
    : `<note pname="${pname}" oct="${oct}" dur="${dur}"/>`;
}

const units2 = [
  { id:"2-q", name:"quarter", final:"quarter", els:[note("c",4,"4")] },
  { id:"2-qr", name:"quarterRest", final:"quarter", els:[`<rest dur="4"/>`] },
  { id:"2-ee", name:"twoEighths", final:"eighth", els:[note("c",4,"8"), note("c",4,"8")] },
  { id:"2-re", name:"eighthRestEighth", final:"eighth", els:[`<rest dur="8"/>`, note("c",4,"8")] }
];

const units3 = [
  { id:"3-dqr", name:"dottedQuarterRest", final:"dottedQuarter", els:[`<rest dur="4" dots="1"/>`] },
  { id:"3-dq", name:"dottedQuarter", final:"dottedQuarter", els:[note("c",4,"4",1)] },
  { id:"3-qre", name:"quarterRestEighth", final:"eighth", els:[`<rest dur="4"/>`, note("c",4,"8")] },
  { id:"3-qrss", name:"quarterRestSixteenths", cannotFinal:true, els:[`<rest dur="4"/>`, note("c",4,"16"), note("c",4,"16")] },
  { id:"3-eq", name:"eighthQuarter", final:"quarter", els:[note("c",4,"8"), note("c",4,"4")] },
  { id:"3-ree", name:"eighthRestEighths", final:"eighth", els:[`<rest dur="8"/>`, note("c",4,"8"), note("c",4,"8")] },
  { id:"3-qe", name:"quarterEighth", final:"eighth", els:[note("c",4,"4"), note("c",4,"8")] },
  { id:"3-ssq", name:"sixteenthsQuarter", final:"quarter", els:[note("c",4,"16"), note("c",4,"16"), note("c",4,"4")] },
  { id:"3-qss", name:"quarterSixteenths", cannotFinal:true, els:[note("c",4,"4"), note("c",4,"16"), note("c",4,"16")] },
  { id:"3-eee", name:"threeEighths", final:"eighth", els:[note("c",4,"8"), note("c",4,"8"), note("c",4,"8")] },
  { id:"3-dse", name:"dottedEighthSixteenthEighth", final:"eighth", els:[note("c",4,"8",1), note("c",4,"16"), note("c",4,"8")] },
  { id:"3-eds", name:"eighthDottedEighthSixteenth", cannotFinal:true, els:[note("c",4,"8"), note("c",4,"8",1), note("c",4,"16")] },
  { id:"3-sde", name:"sixteenthDottedEighthEighth", final:"eighth", els:[note("c",4,"16"), note("c",4,"8",1), note("c",4,"8")] }
];

const units4 = [
  { id:"4-h", name:"half", cannotFinal:true, els:[note("c",4,"2")] },
  { id:"4-hr", name:"halfRest", cannotFinal:true, els:[`<rest dur="2"/>`] },
  { id:"4-qqr", name:"quarterQuarterRest", final:"quarter", els:[note("c",4,"4"), `<rest dur="4"/>`] },
  { id:"4-qrq", name:"quarterRestQuarter", final:"quarter", els:[`<rest dur="4"/>`, note("c",4,"4")] },
  { id:"4-reqr", name:"eighthRestEighthQuarterRest", final:"quarter", els:[`<rest dur="8"/>`, note("c",4,"8"), `<rest dur="4"/>`] },
  { id:"4-qrer", name:"quarterRestEighthRestEighth", final:"eighth", els:[`<rest dur="4"/>`, `<rest dur="8"/>`, note("c",4,"8")] },
  { id:"4-qq", name:"twoQuarters", final:"quarter", els:[note("c",4,"4"), note("c",4,"4")] },
  { id:"4-dqe", name:"dottedQuarterEighth", final:"eighth", els:[note("c",4,"4",1), note("c",4,"8")] },
  { id:"4-edq", name:"eighthDottedQuarter", cannotFinal:true, els:[note("c",4,"8"), note("c",4,"4",1)] },
  { id:"4-eeqr", name:"twoEighthsQuarterRest", final:"quarter", els:[note("c",4,"8"), note("c",4,"8"), `<rest dur="4"/>`] },
  { id:"4-qree", name:"quarterRestTwoEighths", final:"eighth", els:[`<rest dur="4"/>`, note("c",4,"8"), note("c",4,"8")] },
  { id:"4-req", name:"eighthRestEighthQuarter", final:"quarter", els:[`<rest dur="8"/>`, note("c",4,"8"), note("c",4,"4")] }
];

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

/* Double all durations for 5/4 and 7/4, as specified in the source. */
function doubledUnit(unit) {
  const durMap = {"2":"1", "4":"2", "8":"4", "16":"8"};
  const doubled = {...unit};
  doubled.id = unit.id + "x2";
  doubled.els = unit.els.map(eli =>
    eli.replace(/dur="(2|4|8|16)"/, (_, d) => `dur="${durMap[d]}"`)
  );
  doubled.final = {
    eighth:"quarter",
    quarter:"half",
    dottedQuarter:"dottedHalf"
  }[unit.final] || unit.final;
  return doubled;
}

function chooseUnit(group, doubled=false) {
  const unit = randomChoice(group);
  return doubled ? doubledUnit(unit) : unit;
}

function constructPattern(meter) {
  const doubled = meter.endsWith("/4");
  const u2 = doubled ? units2.map(u => doubledUnit(u)) : units2;
  const u3 = doubled ? units3.map(u => doubledUnit(u)) : units3;
  const u4 = doubled ? units4.map(u => doubledUnit(u)) : units4;

  if (meter === "5/8" || meter === "5/4") {
    const two = randomChoice(u2);
    const three = randomChoice(u3);
    return Math.random() < 0.5 ? [two, three] : [three, two];
  }

  const form = randomChoice(["43", "34", "232"]);
  if (form === "43") return [randomChoice(u4), randomChoice(u3)];
  if (form === "34") return [randomChoice(u3), randomChoice(u4)];
  return [randomChoice(u2), randomChoice(u3), randomChoice(u2)];
}

function signature(meter, pattern) {
  return meter + ":" + pattern.map(u => u.id).join("|");
}

function generateExercise() {
  let meter, pattern, answer, sig;

  do {
    meter = randomChoice(["5/8", "7/8", "5/4", "7/4"]);
    pattern = constructPattern(meter);
    answer = pattern[pattern.length - 1].final || null;
    sig = signature(meter, pattern);
  } while (!answer || answer === "dottedHalf" || sig === previousSignature);

  previousSignature = sig;

  const visible = pattern.map(unit => unit.els.slice());
  visible[visible.length - 1].pop();

  return {meter, pattern, visible, answer};
}

/* Beam only consecutive eighth/sixteenth notes. Rests break beams. */
function beamElements(elements) {
  let output = "";
  let beam = [];

  function flush() {
    if (beam.length >= 2) output += `<beam>${beam.join("")}</beam>`;
    else output += beam.join("");
    beam = [];
  }

  for (const mei of elements) {
    const isShortNote = mei.startsWith("<note") && /dur="(8|16)"/.test(mei);
    if (isShortNote) beam.push(mei);
    else { flush(); output += mei; }
  }
  flush();
  return output;
}

function makeScoreMEI(exercise) {
  const lastUnit = exercise.pattern[exercise.pattern.length - 1];
  const omitted = lastUnit.els[lastUnit.els.length - 1];
  const omittedDur = omitted.match(/dur="(2|4|8|16)"/)[1];
  const omittedDots = omitted.includes('dots="1"') ? ' dots="1"' : '';
  const missingSpace = `<space dur="${omittedDur}"${omittedDots}/>`;

  let content = "";
  exercise.visible.forEach((unitElements, i) => {
    content += beamElements(unitElements);
    if (i === exercise.visible.length - 1) content += missingSpace;
  });

  return `
  <mei xmlns="http://www.music-encoding.org/ns/mei">
    <music>
      <body>
        <mdiv>
          <score>
            <scoreDef
              meter.count="${exercise.meter.split("/")[0]}"
              meter.unit="${exercise.meter.split("/")[1]}">
              <staffGrp>
                <staffDef n="1" lines="5" clef.shape="G" clef.line="2"/>
              </staffGrp>
            </scoreDef>
            <section>
              <measure n="1">
                <staff n="1">
                  <layer n="1">
                    ${content}
                  </layer>
                </staff>
              </measure>
            </section>
          </score>
        </mdiv>
      </body>
    </music>
  </mei>`;
}

/* =======================================================
   RENDER EXERCISE — same Verovio setup as the successful app
======================================================= */

function renderExercise(exercise) {
  vrvToolkit.setOptions({
    scale: 65,
    adjustPageHeight: true,
    pageWidth: 1900,
    pageHeight: 850,
    breaks: "none",
    footer: "none",
    header: "none"
  });

  const svg = vrvToolkit.renderData(makeScoreMEI(exercise), {});
  document.getElementById("score").innerHTML = svg;
}

/* =======================================================
   ANSWER BUTTON MEI
======================================================= */

function makeAnswerMEI(duration, dots=0) {
  return `
  <mei xmlns="http://www.music-encoding.org/ns/mei">
    <music>
      <body>
        <mdiv>
          <score>
            <scoreDef>
              <staffGrp>
                <staffDef n="1" lines="5" clef.shape="G" clef.line="2"/>
              </staffGrp>
            </scoreDef>
            <section>
              <measure n="1">
                <staff n="1">
                  <layer n="1">
                    <note pname="c" oct="4" dur="${duration}"${dots ? ' dots="1"' : ''}/>
                  </layer>
                </staff>
              </measure>
            </section>
          </score>
        </mdiv>
      </body>
    </music>
  </mei>`;
}

function renderAnswerButtons() {
  vrvToolkit.setOptions({
    scale: 90,
    pageWidth: 650,
    pageHeight: 550,
    adjustPageHeight: true,
    breaks: "none",
    footer: "none",
    header: "none"
  });

  const answers = [
    ["eighthButton", makeAnswerMEI("8")],
    ["quarterButton", makeAnswerMEI("4")],
    ["dottedQuarterButton", makeAnswerMEI("4", 1)],
    ["halfButton", makeAnswerMEI("2")]
  ];

  answers.forEach(([id, mei]) => {
    document.getElementById(id).innerHTML = vrvToolkit.renderData(mei, {});
  });
}


/* =======================================================
   VOICEOVER AND KEYBOARD ACCESSIBILITY
   ======================================================= */

const voiceoverToggle = document.getElementById("voiceoverToggle");
const repeatPromptButton = document.getElementById("repeatPromptButton");
const voiceoverStatus = document.getElementById("voiceoverStatus");

function speak(text) {
  if (!voiceoverToggle || !voiceoverToggle.checked || !text) return;

  if (!("speechSynthesis" in window)) {
    if (voiceoverStatus) {
      voiceoverStatus.textContent = "Voiceover is not available in this browser.";
    }
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.95;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}

function meterName(meter) {
  return {
    "5/8": "five-eight",
    "7/8": "seven-eight",
    "5/4": "five-four",
    "7/4": "seven-four"
  }[meter] || meter;
}

function rhythmElementSpeech(eli) {
  if (eli.startsWith("<rest")) {
    const m = eli.match(/dur="(2|4|8|16)"/);
    const d = m ? m[1] : "";
    const base = {"2":"half","4":"quarter","8":"eighth","16":"sixteenth"}[d] || "note";
    return (eli.includes('dots="1"') ? "dotted " : "") + base + " rest";
  }

  const m = eli.match(/dur="(2|4|8|16)"/);
  const d = m ? m[1] : "";
  const base = {"2":"half","4":"quarter","8":"eighth","16":"sixteenth"}[d] || "note";
  return (eli.includes('dots="1"') ? "dotted " : "") + base + " note";
}

function unitSpeech(unit, omitLast = false) {
  const elements = omitLast ? unit.els.slice(0, -1) : unit.els;
  return elements.map(rhythmElementSpeech).filter(Boolean).join(", ");
}

function currentPromptSpeech() {
  if (!currentExercise) return "";

  const pieces = [
    "Complete the measure with a single note of the proper duration.",
    "Meter: " + meterName(currentExercise.meter) + "."
  ];

  const visible = currentExercise.pattern.map((unit, i) =>
    unitSpeech(unit, i === currentExercise.pattern.length - 1)
  ).filter(Boolean);

  if (visible.length) {
    pieces.push("Rhythm shown: " + visible.join(". ") + ".");
  }

  return pieces.join(" ");
}

function speakPrompt() {
  const text = currentPromptSpeech();
  if (!text) return;
  if (voiceoverStatus) voiceoverStatus.textContent = text;
  speak(text);
}

function answerLabel(answer) {
  return {
    eighth: "eighth note",
    quarter: "quarter note",
    dottedQuarter: "dotted quarter note",
    half: "half note"
  }[answer] || answer;
}

if (repeatPromptButton) {
  repeatPromptButton.addEventListener("click", speakPrompt);
}

if (voiceoverToggle) {
  voiceoverToggle.addEventListener("change", () => {
    if (voiceoverToggle.checked) {
      speakPrompt();
    } else if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  });
}


/* =======================================================
   GAME STATE
======================================================= */

function newExercise() {
  currentExercise = generateExercise();
  answered = false;

  document.getElementById("feedback").textContent = "";

  ["eighthButton", "quarterButton", "dottedQuarterButton", "halfButton"].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  renderExercise(currentExercise);

  if (!window.__voiceoverPrimed) {
    const primeVoiceover = () => {
      if (window.__voiceoverPrimed) return;
      window.__voiceoverPrimed = true;

      if (voiceoverToggle && voiceoverToggle.checked) {
        speakPrompt();
      }

      document.removeEventListener("keydown", primeVoiceover);
      document.removeEventListener("pointerdown", primeVoiceover);
    };

    document.addEventListener("keydown", primeVoiceover);
    document.addEventListener("pointerdown", primeVoiceover);
  } else {
    speakPrompt();
  }
}

function checkAnswer(selectedAnswer) {
  if (answered) return;
  answered = true;

  ["eighthButton", "quarterButton", "dottedQuarterButton", "halfButton"].forEach(id => {
    document.getElementById(id).disabled = true;
  });

  const labels = {
    eighth: "eighth note",
    quarter: "quarter note",
    dottedQuarter: "dotted quarter note",
    half: "half note"
  };

  const feedback = document.getElementById("feedback");
  const correct = selectedAnswer === currentExercise.answer;

  feedback.textContent = correct
    ? "Correct!"
    : `Not quite — the answer is a ${labels[currentExercise.answer]}.`;

  if (voiceoverToggle && voiceoverToggle.checked) {
    speak(correct
      ? "Correct."
      : `Incorrect. The answer is a ${answerLabel(currentExercise.answer)}.`);
  }

  if (correct) {
    // Automatically move to the next exercise after a successful answer.
    // Give the student a brief moment to hear the feedback before the
    // next prompt is generated and spoken.
    setTimeout(() => {
      newExercise();
    }, 700);
  }
}

/* =======================================================
   BUTTON EVENTS
   ======================================================= */

const answerButtonLabels = {
  eighthButton: "eighth note",
  quarterButton: "quarter note",
  dottedQuarterButton: "dotted quarter note",
  halfButton: "half note"
};

Object.keys(answerButtonLabels).forEach(id => {
  const button = document.getElementById(id);

  button.addEventListener("focus", () => {
    if (suppressNextButtonFocusSpeech) {
      suppressNextButtonFocusSpeech = false;
      return;
    }
    if (voiceoverToggle && voiceoverToggle.checked) {
      speak(answerButtonLabels[id]);
    }
  });

  button.addEventListener("mouseenter", () => {
    if (voiceoverToggle && voiceoverToggle.checked) {
      speak(answerButtonLabels[id]);
    }
  });
});

document.getElementById("eighthButton").addEventListener("click", () => checkAnswer("eighth"));
document.getElementById("quarterButton").addEventListener("click", () => checkAnswer("quarter"));
document.getElementById("dottedQuarterButton").addEventListener("click", () => checkAnswer("dottedQuarter"));
document.getElementById("halfButton").addEventListener("click", () => checkAnswer("half"));


/* Keyboard accessibility:
   Enter repeats the prompt when focus is not on a button.
   Escape stops speech.
   Number keys 1–4 choose the four answer buttons.
*/
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    return;
  }

  if (event.key === "Enter" || event.key === "Return") {
    const active = document.activeElement;
    if (!active || active.tagName !== "BUTTON") {
      event.preventDefault();
      if (voiceoverToggle && voiceoverToggle.checked) speakPrompt();
    }
    return;
  }

  if (/^[1-4]$/.test(event.key)) {
    const buttons = [
      document.getElementById("eighthButton"),
      document.getElementById("quarterButton"),
      document.getElementById("dottedQuarterButton"),
      document.getElementById("halfButton")
    ];
    const button = buttons[Number(event.key) - 1];

    if (button && !button.disabled) {
      event.preventDefault();
      button.click();
      button.focus();
    }
  }
});

/* =======================================================
   INITIALIZE VEROVIO — intentionally identical to the
   initialization pattern in beatcomplete.html
======================================================= */

verovio.module.onRuntimeInitialized = function () {
  vrvToolkit = new verovio.toolkit();
  renderAnswerButtons();
  newExercise();
};

</script>
</body>
</html>
